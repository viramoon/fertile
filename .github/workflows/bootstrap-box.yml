name: 云盒子初始化
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 60
    steps:
      - name: 准备干净容器
        run: |
          apt-get -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y git ca-certificates curl sudo
          useradd --create-home --shell /bin/bash box
          echo 'box ALL=(ALL) NOPASSWD: SETENV: /usr/bin/apt-get' > /etc/sudoers.d/box-bootstrap
          chmod 0440 /etc/sudoers.d/box-bootstrap
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 首次安装、二次跳过、版本与 Postgres
        run: |
          chmod -R a+rX "$GITHUB_WORKSPACE"
          runuser -u box -- env FERTILE_BOX_HOME=/home/box/ci-persistent \
            FERTILE_TEST_LOGS=/home/box/test-logs \
            bash "$GITHUB_WORKSPACE/tests/bootstrap-box.sh"
          cat /home/box/test-logs/timing.env
      - name: 保存安装与耗时证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-box-logs
          path: /home/box/test-logs
