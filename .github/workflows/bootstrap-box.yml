name: 云盒子初始化
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 60
    steps:
      - name: 准备干净容器
        run: |
          apt-get -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y git ca-certificates curl sudo python3
          useradd --create-home --shell /bin/bash box
          echo 'box ALL=(ALL) NOPASSWD: SETENV: /usr/bin/apt-get' > /etc/sudoers.d/box-bootstrap
          chmod 0440 /etc/sudoers.d/box-bootstrap
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 离线验证系统包选择
        run: bash tests/bootstrap-packages.sh
      - name: 首次安装、二次跳过、版本与 Postgres
        run: |
          umask 077
          chmod -R a+rX "$GITHUB_WORKSPACE"
          runuser -u box -- env FERTILE_BOX_HOME=/home/box/ci-persistent \
            FERTILE_TEST_LOGS=/home/box/test-logs \
            bash "$GITHUB_WORKSPACE/tests/bootstrap-box.sh" >"$RUNNER_TEMP/fertile-bootstrap.log" 2>&1
      - name: 生成可公开的安装耗时报告
        run: python3 -B scripts/data-guard.py artifact bootstrap "$RUNNER_TEMP/bootstrap-timing.json" --timing /home/box/test-logs/timing.env
      - name: 保存安装耗时报告
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-timing
          path: ${{ runner.temp }}/bootstrap-timing.json
          if-no-files-found: error
  debian-packages:
    runs-on: ubuntu-24.04
    container: debian:12
    timeout-minutes: 10
    steps:
      - name: 读取 Debian 12 仓库索引
        run: |
          apt-get -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 解析 bootstrap 包名并模拟安装
        shell: bash
        run: |
          packages=$(scripts/bootstrap-box.sh --system-packages)
          grep -Fxq 'libgtk-3-0' <<< "$packages"
          grep -Fxq 'libasound2' <<< "$packages"
          mapfile -t package_list <<< "$packages"
          apt-get --simulate install --no-install-recommends "${package_list[@]}"
