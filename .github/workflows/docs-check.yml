name: 文档检查

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  docs:
    name: 文档检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 获取文档
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: 读取锁定的文档工具版本
        id: versions
        run: |
          source deploy/toolchain.env
          echo "python=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.versions.outputs.python }}
      - name: 准备 YAML 解析器
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: 检查文档与 PR 描述
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          import yaml

          root = Path.cwd()
          required = [
              ".agents/skills/README.md",
              ".github/ISSUE_TEMPLATE/config.yml",
              ".github/ISSUE_TEMPLATE/feature.md",
              ".github/ISSUE_TEMPLATE/production-bug.md",
              ".github/pull_request_template.md",
              ".github/workflows/docs-check.yml",
              ".github/workflows/data-policy.yml",
              ".gitmodules",
              "AGENTS.md",
              "README.md",
              "RELEASES.md",
              "VERSION",
              "contracts/README.md",
              "deploy/README.md",
              "deploy/bootstrap.md",
              "deploy/service.yaml",
              "docs/README.md",
              "docs/adr/ADR-001-cloud-box-network-constraints.md",
              "docs/adr/TEMPLATE.md",
              "docs/architecture.md",
              "docs/data-policy.md",
              "docs/deploy-topology.md",
              "docs/release.md",
              "ops/README.md",
              "ops/health-checks.md",
              "ops/monitoring.md",
              "ops/ruler-runbook.md",
              "scripts/README.md"
          ]
          for name in required:
              path = root / name
              assert path.is_file() and path.read_text(encoding="utf-8").strip(), f"缺少或为空: {name}"

          tracked = subprocess.check_output(["git", "ls-files", "-z"], text=True).split("\0")
          staged = subprocess.check_output(["git", "ls-files", "--stage", "-z"], text=True).split("\0")
          gitlinks = {row.split("\t", 1)[1] for row in staged if row.startswith("160000 ")}
          artifact_gates = {
              (".github/workflows/bootstrap-box.yml", "bootstrap-timing"):
                  ("bootstrap", " --timing /home/box/test-logs/timing.env"),
              (".github/workflows/supervisor.yml", "supervisor-drill"): ("supervisor", ""),
          }
          # Actions expands expressions inside run. Assemble the token used in source YAML.
          runner_temp_expression = "$" + "{{ runner.temp }}"
          for name in filter(None, tracked):
              if name in gitlinks:
                  continue
              path = root / name
              if path.suffix in {".yaml", ".yml"}:
                  document = yaml.safe_load(path.read_text(encoding="utf-8"))
                  if name.startswith(".github/workflows/"):
                      for job in document.get("jobs", {}).values():
                          steps = job.get("steps", [])
                          for i, step in enumerate(steps):
                              if not step.get("uses", "").lower().startswith("actions/upload-artifact@"):
                                  continue
                              upload = step.get("with", {})
                              gate = artifact_gates.get((name, upload.get("name")))
                              assert gate and i > 0 and "if" not in step, f"制品未经过公开报告检查: {name}"
                              profile, timing = gate
                              report = upload["name"] + ".json"
                              assert upload.get("path") == f"{runner_temp_expression}/{report}", f"制品路径不符: {name}"
                              assert upload.get("if-no-files-found") == "error", f"制品必须存在: {name}"
                              previous = steps[i - 1]
                              assert "if" not in previous and not previous.get("continue-on-error"), name
                              assert previous.get("run") == (
                                  f'python3 -B scripts/data-guard.py artifact {profile} "$RUNNER_TEMP/{report}"{timing}'
                              ), f"制品检查步骤不符: {name}"
              if path.suffix == ".md":
                  content = path.read_text(encoding="utf-8")
                  assert content.strip(), f"空文档: {name}"
                  if content.startswith("---\n"):
                      yaml.safe_load(content.split("---", 2)[1])
                  for target in re.findall(r"\[[^\]]*\]\(([^)]+)\)", content):
                      target = target.strip().strip("<>")
                      if urlsplit(target).scheme or target.startswith("#"):
                          continue
                      relative = unquote(target.split("#", 1)[0])
                      if relative:
                          destination = (path.parent / relative).resolve()
                          assert destination.is_relative_to(root.resolve()), f"链接越界: {name}: {target}"
                          assert destination.exists(), f"链接不存在: {name}: {target}"
              if os.environ.get("HEAD_REF") == "issue-1-init":
                  allowed = {"VERSION", ".gitmodules"}
                  assert path.suffix in {".md", ".yaml", ".yml"} or name in allowed, f"初始化范围外文件: {name}"

          body = os.environ.get("PR_BODY", "")
          assert re.search(r"\bCloses\s+#\d+\b", body, re.IGNORECASE), "PR 描述缺少 Closes #<号>"
          assert "测试结果" in body, "PR 描述缺少测试结果"
          print(f"通过：{len(required)} 个必需文件，文档非空、相对链接、YAML、制品上传入口、初始化范围与 PR 描述")
          PY
      - name: 复测数据制品与步骤日志
        run: python -B tests/data_policy_workflows_test.py -v
