name: Healthwatch and observation reports
on:
  pull_request:
  push:
    branches: [main, ha-runthrough]
permissions:
  contents: read
jobs:
  exercises:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r deploy/supervisor-requirements.txt
      - run: python tests/healthwatch_test.py -v
      - run: python tests/soak_report_test.py -v
      - run: python tests/chaos/network_test.py -v
