name: IB Gateway paper safeguards
on:
  pull_request:
  push:
    branches: [ha-runthrough]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: shellcheck scripts/install-ibgateway.sh scripts/ibgateway.sh scripts/ib-check.sh
      - run: python3 -B tests/ibgateway.py
