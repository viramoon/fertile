name: Cross-repository integration
on:
  pull_request:
  push:
    branches: [ha-runthrough, main]
permissions:
  contents: read
concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 220
    env:
      BUILD_MODE: ci-pr
    steps:
      - name: Check out the fertile candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify private repository access and hydrate the committed gitlinks
        env:
          GH_TOKEN: ${{ secrets.FERTILE_SUBMODULES_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Set FERTILE_SUBMODULES_TOKEN in fertile Actions secrets with Contents read access to the three private component repositories."
            exit 1
          fi
          for module in finance web frontend; do
            repo="viramoon/$module"
            if ! gh api --silent "repos/$repo"; then
              echo "::error::Cannot read $repo with FERTILE_SUBMODULES_TOKEN. Check repository selection and authorization."
              exit 1
            fi
            pin=$(git rev-parse "HEAD:$module")
            if ! gh api --silent "repos/$repo/commits/$pin"; then
              echo "::error::$repo is readable but commit $pin is unavailable. Check Contents read access and the published gitlink."
              exit 1
            fi
          done
          gh auth setup-git --hostname github.com
          git submodule sync --recursive
          git submodule update --init --recursive
          fetch_contract_source() {
            local producer=$1 marker="$2/openapi/$1.commit" recorded
            recorded=$(cat "$marker")
            if [[ ! $recorded =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Expected a full producer commit in $marker."
              return 1
            fi
            if [[ $(git -C "$producer" cat-file -t "$recorded" 2>/dev/null) != commit ]]; then
              if ! git -C "$producer" fetch --no-tags origin "$recorded"; then
                echo "::error::Cannot fetch the producer commit recorded in $marker."
                return 1
              fi
            fi
          }
          fetch_contract_source finance web
          fetch_contract_source web frontend
          git config --global --remove-section credential.https://github.com
      - name: Verify published gitlinks and their working trees
        env:
          GH_TOKEN: ${{ secrets.FERTILE_SUBMODULES_TOKEN }}
        run: |
          gh auth setup-git --hostname github.com
          scripts/check-submodules.sh
          source deploy/toolchain.env
          test "$(git -C finance/vendor/nautilus_trader rev-parse HEAD)" = "$NAUTILUS_COMMIT"
          git config --global --remove-section credential.https://github.com
      - name: Prepare disposable runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          echo "FERTILE_BOX_HOME=$RUNNER_TEMP/box" >> "$GITHUB_ENV"
          echo "FERTILE_ROOT=$RUNNER_TEMP/box/fertile" >> "$GITHUB_ENV"
          echo "FINANCE_BUILD_ROOT=$RUNNER_TEMP/box/fertile/cache/finance" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          df -h "$RUNNER_TEMP"
      - name: Install the locked box environment
        run: |
          start=$SECONDS
          scripts/bootstrap-box.sh
          source "$FERTILE_ROOT/env.sh"
          rustup component add rustfmt
          printf 'BOOTSTRAP_SECONDS=%s\n' "$((SECONDS-start))"
          du -sh "$FERTILE_ROOT/cache/downloads" "$FERTILE_ROOT/cache/sources"
          rm -rf -- "$FERTILE_ROOT/cache/downloads" "$FERTILE_ROOT/cache/sources"
          df -h "$RUNNER_TEMP"
      - name: Compute the Nautilus wheel cache key
        id: wheel-key
        shell: bash
        run: |
          source "$FERTILE_ROOT/env.sh"
          {
            # Finance fixes HIGH_PRECISION=true and uses BUILD_MODE in its wheel key.
            printf '%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion" "$BUILD_MODE" true
            # The gitlink binds the finance tree, including its locks and the Nautilus source pin.
            git rev-parse HEAD:finance
            sha256sum deploy/toolchain.env scripts/bootstrap-box.sh scripts/build-release.sh .github/workflows/integration.yml
            cd finance
            unset RUSTUP_TOOLCHAIN
            uname -m
            rustc -Vv
            clang --version
            python3 -c 'import sysconfig; print(sysconfig.get_config_var("SOABI"))'
            dpkg-query --showformat='${Package}=${Version}\n' --show libc6 libc6-dev libssl-dev zlib1g-dev
          } | sha256sum | awk '{print "key=fertile-native-wheel-v2-" $1}' >> "$GITHUB_OUTPUT"
      - name: Restore the pinned Nautilus wheel
        id: restore-wheel
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.FINANCE_BUILD_ROOT }}/wheels
          key: ${{ steps.wheel-key.outputs.key }}
      - name: Build the three components
        env:
          NATIVE_WHEEL_CACHE_HIT: ${{ steps.restore-wheel.outputs.cache-hit }}
        run: |
          source "$FERTILE_ROOT/env.sh"
          printf 'NATIVE_WHEEL_CACHE_HIT=%s\n' "${NATIVE_WHEEL_CACHE_HIT:-false}"
          start=$SECONDS
          scripts/fertile build --ref "$GITHUB_SHA"
          printf 'RELEASE_BUILD_SECONDS=%s\n' "$((SECONDS-start))"
      - name: Reclaim runner space for the wheel cache archive
        run: |
          df -h "$RUNNER_TEMP"
          du -sh "$FINANCE_BUILD_ROOT/wheels"
          # The separate release Cargo target is reused by contract export below.
          for directory in "$FINANCE_BUILD_ROOT/cargo-target" "$FINANCE_BUILD_ROOT/sources"; do
            if [[ -d "$directory" ]]; then du -sh "$directory"; fi
          done
          rm -rf -- "$FINANCE_BUILD_ROOT/cargo-target" "$FINANCE_BUILD_ROOT/sources"
          df -h "$RUNNER_TEMP"
      - name: Save the verified Nautilus wheel
        if: steps.restore-wheel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.FINANCE_BUILD_ROOT }}/wheels
          key: ${{ steps.wheel-key.outputs.key }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Read the OpenAPI Generator pin from web
        id: openapi-pin
        shell: bash
        run: |
          # Read the existing web pins without sourcing the generator.
          generator=web/scripts/gen-finance-client.sh
          version=$(sed -n 's/^version=//p' "$generator")
          sha256=$(sed -n 's/^checksum=//p' "$generator")
          url=$(sed -nE 's|^[[:space:]]*"(https://[^"]+)" -o "\$download"$|\1|p' "$generator")
          url=${url//\$version/$version}
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! $sha256 =~ ^[0-9a-f]{64}$ ||
                ! $url =~ ^https://[^[:space:]]+$ || $url == *'$'* ]]; then
            echo "::error::Cannot read the pinned OpenAPI Generator version, SHA-256 and HTTPS URL from $generator."
            exit 1
          fi
          printf 'version=%s\nsha256=%s\nurl=%s\njar=%s/openapi-generator-cli-%s.jar\n' \
            "$version" "$sha256" "$url" "$RUNNER_TEMP" "$version" >> "$GITHUB_OUTPUT"
      - name: Restore the pinned OpenAPI Generator JAR
        id: restore-openapi
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.openapi-pin.outputs.jar }}
          key: fertile-openapi-generator-${{ steps.openapi-pin.outputs.version }}-${{ steps.openapi-pin.outputs.sha256 }}
      - name: Verify or download the pinned OpenAPI Generator JAR
        env:
          CACHE_HIT: ${{ steps.restore-openapi.outputs.cache-hit }}
          OPENAPI_GENERATOR_JAR: ${{ steps.openapi-pin.outputs.jar }}
          OPENAPI_GENERATOR_SHA256: ${{ steps.openapi-pin.outputs.sha256 }}
          OPENAPI_GENERATOR_URL: ${{ steps.openapi-pin.outputs.url }}
        run: |
          bash scripts/fetch-openapi-generator.sh "${CACHE_HIT:-false}" \
            "$OPENAPI_GENERATOR_URL" "$OPENAPI_GENERATOR_SHA256" "$OPENAPI_GENERATOR_JAR"
      - name: Save the verified OpenAPI Generator JAR
        if: steps.restore-openapi.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.openapi-pin.outputs.jar }}
          key: fertile-openapi-generator-${{ steps.openapi-pin.outputs.version }}-${{ steps.openapi-pin.outputs.sha256 }}
      - name: Re-export contracts and regenerate both clients
        env:
          OPENAPI_GENERATOR_JAR: ${{ steps.openapi-pin.outputs.jar }}
        run: |
          source "$FERTILE_ROOT/env.sh"
          (cd frontend && pnpm install --frozen-lockfile)
          scripts/contract-diff.sh
          bash tests/contract-drift.sh
      - name: Prepare the isolated artifact drills
        run: |
          if ! command -v tini >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends tini
          fi
          source "$FERTILE_ROOT/env.sh"
          scripts/setup-supervisor.sh
      - name: Prepare locked test dependencies and rclone for the local encrypted remote
        run: |
          source "$FERTILE_ROOT/env.sh"
          cargo_host=$(rustc -vV | sed -n 's/^host: //p')
          (cd finance && cargo fetch --locked --target "$cargo_host")
          (cd web && cargo fetch --locked --target "$cargo_host")
          (
            cd "$RUNNER_TEMP"
            archive=rclone-v1.76.0-linux-amd64.zip
            curl -fsSLo "$archive" --retry 3 "https://downloads.rclone.org/v1.76.0/$archive"
            echo "b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7  $archive" | sha256sum -c -
            unzip -q "$archive"
          )
      - name: Exercise the pinned outbox, gap recovery and encrypted WAL restore
        run: |
          source "$FERTILE_ROOT/env.sh"
          export FERTILE_TEST_RCLONE="$RUNNER_TEMP/rclone-v1.76.0-linux-amd64/rclone"
          export FERTILE_BACKUP_TEST_WAL="$FERTILE_ROOT/current/bin/finance-market-wal"
          export FINANCE_F3_TEST_PYTHON="$FERTILE_ROOT/current/runtime/venv/bin/python"
          test -x "$FERTILE_TEST_RCLONE"
          test -x "$FERTILE_BACKUP_TEST_WAL"
          test -x "$FINANCE_F3_TEST_PYTHON"
          export CARGO_NET_OFFLINE=true SQLX_OFFLINE=true
          (
            cd finance
            cargo test --offline --locked --release -p finance-collector --lib market_
            cargo test --offline --locked --release -p finance-collector --test option_exposure
            cargo test --offline --locked --release -p finance-collector --test market_wal_projector \
              -- --include-ignored
          )
          (
            cd web
            cargo test --offline --locked --release --lib notifications
            cargo test --offline --locked --release --test api notifications
          )
          python3 -B tests/backup_remote_test.py EncryptedRecovery.test_encrypted_wal_full_and_hourly_restore_gap_and_new_epoch
      - name: Verify the F12 producer separately from the candidate gitlink
        run: |
          source "$FERTILE_ROOT/env.sh"
          f12=f4786109e3812e4946adb92e97e513f1fbae5d79
          producer=$(mktemp -d "$RUNNER_TEMP/finance-f12.XXXXXXXX")
          trap 'rm -rf -- "$producer"' EXIT
          git -C finance archive "$f12" | tar -xm -C "$producer"
          cd "$producer"
          # Revisions of the same Cargo packages must not share compiled artifacts.
          export CARGO_TARGET_DIR="$producer/target"
          cargo_host=$(rustc -vV | sed -n 's/^host: //p')
          cargo fetch --locked --target "$cargo_host"
          export CARGO_NET_OFFLINE=true
          cargo test --offline --locked --release -p finance-collector --test option_history
          cargo test --offline --locked --release -p finance-ib --lib \
            verified_paper_option_history_requests_and_decodes_synthetic_bars
      - name: Switch the real finance API while synthetic collection advances
        run: |
          "$FERTILE_ROOT/tools/supervisor/bin/python" -B tests/container_hot_upgrade_test.py --require-native \
            --finance-api "$FERTILE_ROOT/current/bin/finance-api" \
            --finance-config "$FERTILE_ROOT/current/finance/config"
      - name: Read the expanded synthetic queue with the published finance API artifact
        run: |
          source "$FERTILE_ROOT/env.sh"
          export CARGO_NET_OFFLINE=true
          python3 -B tests/published_queue_readback.py --finance-source "$PWD/finance" \
            --candidate "$FERTILE_ROOT/current/bin/finance-api"
      - name: Exercise the actual supervised local deployment with ReplaySource
        run: |
          set -eu
          source "$FERTILE_ROOT/env.sh"
          umask 077
          mkdir -p "$FERTILE_ROOT/config" "$FERTILE_ROOT/secrets" "$FERTILE_ROOT/run"
          python3 -B tests/replay_fixture.py "$FERTILE_ROOT/run"
          python3 - <<'PYTHON'
          from contextlib import ExitStack
          import os
          import secrets
          import socket
          from pathlib import Path

          root = Path(os.environ["FERTILE_ROOT"])
          with ExitStack() as stack, (root / "config/runtime.env").open("x") as settings:
              settings.write(f"FERTILE_MARKET_SOURCE=replay\nFINANCE_COLLECTOR_CONFIG={root}/run/replay-nine.yaml\n")
              for name in ("FINANCE_API_PORT", "FINANCE_COLLECTOR_PORT", "WEB_PORT"):
                  listener = stack.enter_context(socket.socket())
                  listener.bind(("127.0.0.1", 0))
                  settings.write(f"{name}={listener.getsockname()[1]}\n")
          with (root / "secrets/web.env").open("x") as token:
              token.write("WEB_ADMIN_TOKEN=" + secrets.token_hex(32) + "\n")
          PYTHON
          scripts/fertile up
          export FINANCE_BUILD_ROOT="$FERTILE_ROOT/current/runtime"
          export FERTILE_DATA_ROOT="$FERTILE_ROOT/data/replay"
          export PYTHONDONTWRITEBYTECODE=1
          (cd "$FERTILE_ROOT/current/finance" && bash scripts/backtest-sample.sh)
          export FERTILE_RESEARCH_ROOT="$FERTILE_ROOT/data/research"
          PYTHONPATH="$FERTILE_ROOT/current/finance/python" "$FINANCE_BUILD_ROOT/venv/bin/python" tests/research-fixture.py
          scripts/fertile status --json
          WEB_DATABASE_TEST_BIN="$FERTILE_ROOT/current/bin/web" WEB_DATABASE_TEST_CONFIG="$FERTILE_ROOT/current/web/config" \
            "$FERTILE_ROOT/tools/supervisor/bin/python" -B tests/web-database.py
          python3 tests/test_e2e_smoke.py
          tests/e2e-smoke.sh local --replay-nine --research-instrument FIXTURE.XNYS --research-kind fixture
          python3 tests/chaos/services.py postgres
      - name: Shut down the private test instance
        if: always()
        run: |
          if [[ -S "$FERTILE_ROOT/run/supervisor.sock" ]]; then scripts/fertile down; fi
