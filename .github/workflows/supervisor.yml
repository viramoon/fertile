name: 进程守护与恢复
on:
  pull_request:
  push:
    branches: [ha-runthrough]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supervisor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the isolated host drill tools
        run: |
          if ! command -v shellcheck >/dev/null || ! command -v tini >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y shellcheck tini
          fi
      - name: Check shell entry points
        run: |
          shellcheck scripts/fertile scripts/runtime-root.sh scripts/systemd-service.sh scripts/setup-supervisor.sh \
            scripts/build-release.sh scripts/postgres.sh \
            tests/build-atomicity.sh tests/chaos-restart.sh tests/simulate-reboot.sh
      - name: Verify isolated build failure preserves the current stack
        run: bash tests/build-atomicity.sh
      - name: Check Python dependency hints without site packages
        run: python3 -B tests/control_dependencies.py
      - name: Install the pinned supervisor
        run: |
          python3 -m venv "$RUNNER_TEMP/fertile-supervisor"
          "$RUNNER_TEMP/fertile-supervisor/bin/python" -m pip install -r deploy/supervisor-requirements.txt
      - name: Verify rendered systemd units and exercise manager selection offline
        env:
          FERTILE_ROOT: ${{ runner.temp }}/fertile-systemd-fixture
          FERTILE_CONTROL_PYTHON: ${{ runner.temp }}/fertile-supervisor/bin/python
        run: |
          scripts/fertile verify-systemd
          "$FERTILE_CONTROL_PYTHON" -B tests/systemd.py
          "$FERTILE_CONTROL_PYTHON" -B tests/test_e2e_smoke.py
          "$FERTILE_CONTROL_PYTHON" -B tests/hot_upgrade_test.py
          "$FERTILE_CONTROL_PYTHON" -B tests/hot_upgrade_cli_test.py
          "$FERTILE_CONTROL_PYTHON" -B tests/hot_upgrade_recovery_test.py
      - name: Exercise the real tini container entrypoint and API handoff
        run: '"$RUNNER_TEMP/fertile-supervisor/bin/python" -B tests/container_hot_upgrade_test.py --require-native'
      - name: Exercise rendering, restarts and whole-stack recovery
        run: |
          umask 077
          {
            "$RUNNER_TEMP/fertile-supervisor/bin/python" tests/supervision_plan.py
            "$RUNNER_TEMP/fertile-supervisor/bin/python" tests/supervisor_process_test.py
            "$RUNNER_TEMP/fertile-supervisor/bin/python" -u tests/supervisor_ci.py
          } >"$RUNNER_TEMP/fertile-supervisor.log" 2>&1
      - name: Prepare the public drill result
        run: python3 -B scripts/data-guard.py artifact supervisor "$RUNNER_TEMP/supervisor-drill.json"
      - name: Save the drill result
        uses: actions/upload-artifact@v4
        with:
          name: supervisor-drill
          path: ${{ runner.temp }}/supervisor-drill.json
          if-no-files-found: error
  systemd-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the disposable systemd test image
        run: |
          context="$RUNNER_TEMP/fertile-systemd-image"
          mkdir -p "$context"
          cp deploy/supervisor-requirements.txt "$context/"
          docker build -f tests/systemd-process.Dockerfile -t fertile-systemd-drill "$context"
      - name: Start and stop the rendered units in an isolated systemd manager
        run: python3 -B tests/systemd_process_test.py --image fertile-systemd-drill
