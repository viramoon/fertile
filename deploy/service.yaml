# 系统部署清单。命令、依赖和启用条件详见 deploy/services.yaml。
version: 2
system: fertile
services: deploy/services.yaml
release:
  repository: viramoon/fertile
  tag_pattern: vX.Y.Z
  version_source: VERSION
  submodule_versions: gitlinks
profiles:
  cloudbox:
    persistent_root: /home/box/fertile
    account_policy: paper-only
    managers: [supervisord, tini-supervisord]
  stable:
    persistent_root: /var/lib/fertile
    account_policy: paper-only
    managers: [systemd, supervisord, tini-supervisord]
components:
  - name: finance
    submodule: finance
    manifest: finance/service.yaml
    target: cloudbox # 当前压测部署，普通服务器使用 stable profile
    processes:
      finance-api: {command: current/bin/finance-api, host: 127.0.0.1, port: 8081}
      finance-collector: {command: current/bin/finance-collector, host: 127.0.0.1, port: 8082, sources: [ib, replay]}
      finance-collector-binance: {command: current/bin/finance-binance, status: integration-template, profile_config: finance/config/binance, config_env: FINANCE_BINANCE_CONFIG, default_enabled: false}
      finance-collector-hyperliquid: {status: integration-template, default_enabled: false}
      finance-projector: {module: fertile_finance.market_projector, wal_command: current/bin/finance-market-wal, status: optional, enable_env: FERTILE_ENABLE_FINANCE_PROJECTOR, default_enabled: false}
      finance-backtest-worker: {command: current/finance/scripts/finance-backtest-worker, indicator_command: current/bin/finance-strategy, lease_seconds: 15}
      finance-backtest-worker-f13: {status: integration-template, default_enabled: false}
      finance-live-decision: {command: current/finance/scripts/finance-decision, status: integration-template, required_args: [--plan, --replay], default_enabled: false}
    market_state: {wal: finance-state/market-wal, projection: finance-state/market-projection, catalog: catalog/market-events}
    option_history: {mode: in-process-paper-read-only, databento_default: disabled}
    health: {live: /healthz/live, ready: /healthz/ready, market: /api/v1/market/status}
  - name: web
    submodule: web
    manifest: web/service.yaml
    target: cloudbox # 当前压测部署，普通服务器使用 stable profile
    command: current/bin/web serve
    migrate: current/bin/web migrate
    migration_head: "20261127074531" # W5 主动静默，包含此前 W3、W4 和 W2a 迁移
    host: 127.0.0.1
    port: 8090
    health: {live: /healthz/live, ready: /healthz/ready, system: /api/v1/system/status}
    processes:
      web-notifier: {command: current/bin/web-notifier, enable_env: FERTILE_ENABLE_WEB_NOTIFIER, default_enabled: false}
artifacts:
  - name: frontend-dist
    submodule: frontend
    command: pnpm build
    hosted_by: web
    destination: current/static
infrastructure:
  postgres:
    major: 17
    socket: run/postgres
    database: web
    schemas: [app, blog]
    data: data/postgres
  tunnel:
    managed_by: Maas · Ruler
    external: true
    ingress: http://127.0.0.1:8090
    # 本机仅做本地压测。未来生产服务器由运维显式配置其 HTTPS 入口。
    public_origin: null
  ib_gateway:
    host: 127.0.0.1
    paper_port: 4002
    account: paper
    read_only: true
    credentials_file: secrets/ibkr-paper.env # 相对于所选持久根目录
    install: scripts/install-ibgateway.sh
    check: scripts/ib-check.sh
    run: scripts/ibgateway.sh run
    display: scripts/ibgateway.sh xvfb
    state: data/ibgateway
    logs: logs/ibgateway
paths: # 均相对于持久根，默认值见 profiles，可用 FERTILE_ROOT / FERTILE_BOX_HOME 覆盖。
  # 持久根、独立数据根和运维导出目录均须在四仓工作树外，见 data_publication_policy。
  releases: releases
  active: current
  data: data
  research_catalog: data/research
  config: config
  logs: logs
  run: run
  hot_upgrade_state: state/hot-upgrade
  hot_upgrade_start_permits: run/handoff-start
  service_releases: config/service-releases.json
  secrets: secrets
  tools: tools
  backups: backups
operations:
  data_publication_policy: docs/data-policy.md
  bootstrap: deploy/bootstrap.md
  server_guide: deploy/linux-server.md
  runbook: ops/ruler-runbook.md
  health_checks: ops/health-checks.md
  supervisor: supervisord
  container_init: tini
  systemd: deploy/systemd
  hot_upgrade: deploy/hot-upgrade.md
  v1_integration: docs/v1-integration.md
  commands:
    build: scripts/fertile build
    stage: scripts/fertile build --stage-only --ref SHA
    container: scripts/fertile container
    hot_upgrade: scripts/fertile hot-upgrade SERVICE SHA --hook PATH
    hot_upgrade_status: scripts/fertile hot-upgrade-status --json
    hot_upgrade_reconcile: scripts/fertile hot-upgrade-reconcile ID --hook PATH
    install_systemd: scripts/fertile install-systemd --root <root> --user <user> --group <group>
    uninstall_systemd: scripts/fertile uninstall-systemd --root <root>
    verify_systemd: scripts/fertile verify-systemd
    up: scripts/fertile up
    down: scripts/fertile down
    ensure: scripts/fertile ensure-up
    status: scripts/fertile status --json
    restart: scripts/fertile restart <service>
    logs: scripts/fertile logs <service>
    rollback: scripts/fertile rollback <commit>
  restart_policy: # supervisord 的选项，systemd 见 deploy/systemd
    autorestart: true
    stopsignal: TERM
    stopwaitsecs: 30
    stopasgroup: true
    killasgroup: true
backups:
  command: scripts/backup.sh
  restore: scripts/restore.sh
  storage: backups
  format: PostgreSQL custom dump, SQLite online backup and catalog hardlinks
  schedule: deploy/healthwatch.yaml
  retention:
    daily: 7
    weekly: 4
  offsite_remote_env: FERTILE_BACKUP_REMOTE
  offsite_default: disabled
  offsite:
    full: python3 scripts/backup_remote.py full
    hourly: python3 scripts/backup_remote.py hourly
    status: python3 scripts/backup_remote.py status
    restore: python3 scripts/backup_remote.py restore
    prune: python3 scripts/backup_remote.py prune
    settings_file: config/backup.conf
    rclone_binary_env: FERTILE_BACKUP_RCLONE
    rclone_config_file: secrets/backup-rclone.conf
    wal_binary_env: FERTILE_BACKUP_WAL_BIN
    wal_products_env: FERTILE_BACKUP_WAL_PRODUCTS
    full_at_utc: "03:00"
    incremental_interval_seconds: 3600
    max_recoverable_age_seconds: 3600
    runbook: ops/backup.md
