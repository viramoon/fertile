# 系统部署清单。命令、依赖和启用条件详见 deploy/services.yaml。
version: 2
system: fertile
services: deploy/services.yaml
release:
  repository: viramoon/fertile
  tag_pattern: vX.Y.Z
  version_source: VERSION
  submodule_versions: gitlinks
profiles:
  cloudbox:
    persistent_root: /home/box/fertile
    account_policy: paper-only
  stable:
    persistent_root: TBD # 迁移时确认目标挂载点
    account_policy: paper-only
components:
  - name: finance
    submodule: finance
    manifest: finance/service.yaml
    target: cloudbox
    processes:
      finance-api: {command: current/bin/finance-api, host: 127.0.0.1, port: 8081}
      finance-collector: {command: current/bin/finance-collector, host: 127.0.0.1, port: 8082}
      finance-backtest-worker: {command: current/finance/scripts/finance-backtest-worker}
    health: {live: /healthz/live, ready: /healthz/ready, market: /api/v1/market/status}
  - name: web
    submodule: web
    manifest: web/service.yaml
    target: cloudbox
    command: current/bin/web serve
    migrate: current/bin/web migrate
    host: 127.0.0.1
    port: 8080
    health: {live: /healthz/live, ready: /healthz/ready, system: /api/v1/system/status}
artifacts:
  - name: frontend-dist
    submodule: frontend
    command: pnpm build
    hosted_by: web
    destination: current/static
infrastructure:
  postgres:
    major: 17
    socket: run/postgres
    database: web
    schemas: [app, blog]
    data: data/postgres
  tunnel:
    protocol: quic
    ingress: http://127.0.0.1:8080
    existing_config: /home/box/.cloudflared/config.yml
    public_origin: null # 用户确认 www.viramoon.com 或 www.viramoonstar.com 后设置
    supervisor: cloudflared
  ib_gateway:
    host: 127.0.0.1
    paper_port: 4002
    account: paper
    read_only: true
    credentials_file: /home/box/fertile/secrets/ibkr-paper.env
    install: scripts/install-ibgateway.sh
    check: scripts/ib-check.sh
    run: scripts/ibgateway.sh run
    display: scripts/ibgateway.sh xvfb
    state: data/ibgateway
    logs: logs/ibgateway
paths:
  root: /home/box/fertile
  releases: releases
  active: current
  data: data
  logs: logs
  run: run
  backups: backups
operations:
  bootstrap: deploy/bootstrap.md
  runbook: ops/ruler-runbook.md
  health_checks: ops/health-checks.md
  supervisor: supervisord
  commands:
    build: scripts/fertile build
    up: scripts/fertile up
    down: scripts/fertile down
    ensure: scripts/fertile ensure
    status: scripts/fertile status --json
    restart: scripts/fertile restart <service>
    logs: scripts/fertile logs <service>
    rollback: scripts/fertile rollback <commit>
  restart_policy:
    autorestart: true
    stopsignal: TERM
    stopwaitsecs: 30
    stopasgroup: true
    killasgroup: true
backups:
  command: scripts/backup.sh
  restore: scripts/restore.sh
  storage: backups
  format: PostgreSQL custom dump, SQLite online backup and catalog hardlinks
  schedule: deploy/healthwatch.yaml
  retention:
    daily: 7
    weekly: 4
  offsite_remote_env: FERTILE_BACKUP_REMOTE
  offsite_default: disabled
